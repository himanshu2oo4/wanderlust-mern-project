apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: frontend-dep
  namespace: wanderlust
spec: 
  replicas: 2 
  selector: 
    matchLabels: 
      app: frontend 
  template: 
    metadata: 
      labels: 
        app: frontend 
    spec: 
      containers: 
        - name: frontend 
          image: himanshu1236/wanderlust-frontend:latest 
          ports: 
            - containerPort: 80 
