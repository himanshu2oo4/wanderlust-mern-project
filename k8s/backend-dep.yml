apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend-dep
  namespace: wanderlust 
spec: 
  replicas: 2 
  selector: 
    matchLabels: 
      app: backend 
  template: 
    metadata: 
      labels: 
        app: backend
    spec: 
      containers: 
        - name: backend
          image: himanshu1236/wanderlust-backend:latest
          ports: 
            - containerPort: 5000 
          env: 
            - name: MONGODB_URI
              value: mongodb://mongo:27017/wanderlust

