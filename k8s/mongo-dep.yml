kind: Deployment
apiVersion: apps/v1
metadata: 
  name: mongo-dep 
  namespace: wanderlust
spec: 
  replicas: 1
  selector: 
    matchLabels: 
      app: mongo 
  template: 
    metadata:   
      labels: 
        app: mongo 
    spec: 
      containers: 
        - name: mongo
          image: mongo:7.0
          ports: 
            - containerPort: 27017 
