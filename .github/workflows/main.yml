name: Build Images
on: 
    push: 
        branches: 
            - main 
        paths:
          - ".github/workflows/**"
jobs: 
    build: 
        runs-on: ubuntu-latest
        steps: 
            - name: copying code 
              uses: actions/checkout@v4

            - name: Login to docker hub
              uses: docker/login-action@v4
              with: 
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Building backend image
              run: | 
                docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-backend:latest ./backend


            - name: Building frontend image
              run: | 
                docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/wanderlust-frontend:latest ./frontend

            - name: Pushing both images to dockerhub 
              run: | 
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderLust-frontend:latest 
                docker push ${{ secrets.DOCKERHUB_USERNAME }}/wanderLust-backend:latest

            


              
