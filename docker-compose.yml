services:
  
  mongo: 
    image: mongo:latest 
    container_name: mongo 
    restart: always 

    ports: 
      - "27017:27017"

    volumes: 
      - mongo-data:/data/db

    networks: 
      - mern-network 

  backend: 
    image: himanshu1236/wanderlust-backend:latest

    container_name: backend
    restart: always 
    ports: 
      - "5000:5000" 
    env_file: 
      - "./backend/.env"

    depends_on: 
      - mongo 
    networks: 
      - mern-network  


  frontend: 
    image: himanshu1236/wanderlust-frontend:latest 

    container_name: frontend 
    restart: always 
    ports: 
      - "3000:5173"
    depends_on:
      - backend 

    networks: 
      - mern-network 

volumes: 
  mongo-data: 

networks: 
  mern-network: 
    

